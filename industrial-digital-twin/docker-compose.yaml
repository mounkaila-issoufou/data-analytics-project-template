version: '3.8'
services:
  digital_twin: 
    build: .
    command: digital_twin run
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src/digital_twin
    depends_on: []
    restart: unless-stopped
    postgres:
    image: postgres:15
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
        POSTGRES_DB: digital_twin_db
    ports:
        - "5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
